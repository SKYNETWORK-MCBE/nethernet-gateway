on:
  push:
    tags:
      - 'v*.*.*'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: [self-hosted, sky-docker]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Verify package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "v$package_version" != "${{ github.ref_name }}" ]; then
            printf 'Tag %s does not match package version %s\n' "${{ github.ref_name }}" "$package_version" >&2
            exit 1
          fi

      - name: Stage package for npm approval
        run: pnpm stage publish --no-git-checks --provenance

      - name: Create GitHub Release
        run: gh release create ${{ github.ref_name }} --draft --notes "${{ github.ref_name }}"
