on:
  push:
    tags:
      - 'v*.*.*'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Verify package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "v$package_version" != "${{ github.ref_name }}" ]; then
            printf 'Tag %s does not match package version %s\n' "${{ github.ref_name }}" "$package_version" >&2
            exit 1
          fi

      - name: Resolve release channel
        id: channel
        run: |
          case "${{ github.ref_name }}" in
            *-*)
              prerelease="${GITHUB_REF_NAME#*-}"
              echo "npm_tag=${prerelease%%.*}" >> "$GITHUB_OUTPUT"
              echo "gh_flags=--prerelease" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
              echo "gh_flags=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Stage package for npm approval
        run: pnpm stage publish --no-git-checks --provenance --tag ${{ steps.channel.outputs.npm_tag }}

      - name: Create GitHub Release
        run: gh release create ${{ github.ref_name }} --draft ${{ steps.channel.outputs.gh_flags }} --notes "${{ github.ref_name }}"
